# Airflow Helm Values for Azure AKS
# Render placeholders, then apply with helm/apply-airflow.sh.
# Environment-specific values are replaced by setup-walkthrough-azure during deployment.

executor: CeleryExecutor
enableServiceLinks: false

apiSecretKeySecretName: airflow-api-secret-key-external

# Custom Airflow image with the database drivers required by this starter.
# The baseline uses namespace-local Kubernetes Secrets; ESO/Key Vault is optional.
# Pre-built and hosted on GitLab - pulled with the same datasurface-registry secret
images:
  airflow:
    repository: registry.gitlab.com/datasurface-inc/datasurface/airflow
    tag: "3.3.0-azure-supported-merge-drivers-20260714"

# Registry secret for pulling custom Airflow image from GitLab
registry:
  secretName: datasurface-registry

# External Azure Database for PostgreSQL Flexible Server
postgresql:
  enabled: false

data:
  metadataSecretName: airflow-metadata
  brokerUrlSecretName: airflow-broker-url

# Redis for Celery broker
redis:
  enabled: true
  passwordSecretName: airflow-redis-password
  persistence:
    enabled: true
    storageClassName: azurefile-csi-nfs
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scheduler
scheduler:
  replicas: 1
  serviceAccount:
    create: true
    name: airflow-scheduler
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  logGroomerSidecar:
    retentionDays: 2

# Workers
workers:
  celery:
    # helm/apply-airflow.sh overrides this with the discovered/approved count
    # of nodes eligible for Airflow workers.
    replicas: 1
    serviceAccount:
      create: true
      name: airflow-worker
    persistence:
      enabled: true
      storageClassName: azurefile-csi-nfs
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            component: worker
    logGroomerSidecar:
      retentionDays: 2
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

# API server
apiServer:
  serviceAccount:
    create: true
    name: airflow-api-server
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

# DAG processor
dagProcessor:
  enabled: true
  serviceAccount:
    create: true
    name: airflow-dag-processor
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  logGroomerSidecar:
    retentionDays: 2

# Triggerer
triggerer:
  enabled: true
  serviceAccount:
    create: true
    name: airflow-triggerer
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  logGroomerSidecar:
    retentionDays: 2

# GitSync for DAGs
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: true
    repo: https://github.com/PLACEHOLDER_AIRFLOW_REPO.git
    branch: main
    subPath: dags
    wait: 60
    credentialsSecret: git-dags
    recommendedProbeSetting: true

# Logs
logs:
  persistence:
    enabled: true
    storageClassName: azurefile-csi-nfs
    size: 25Gi

config:
  core:
    parallelism: "4"
    max_active_tasks_per_dag: "4"
    dagbag_import_timeout: "90"
  dag_processor:
    dag_file_processor_timeout: "120"
  celery:
    worker_concurrency: "4"
  logging:
    delete_local_logs: "False"
  scheduler:
    dag_dir_list_interval: "60"
    max_tis_per_query: "4"
    max_dagruns_to_create_per_loop: "16"
    max_dagruns_per_loop_to_schedule: "32"

# Cleanup CronJob - purges old metadata to prevent scheduler slowdown
cleanup:
  enabled: true
  schedule: "*/30 * * * *"
  args: ["bash", "-c", "exec airflow db clean --clean-before-timestamp \"$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%S)\" --skip-archive -y -t celery_taskmeta -t dag_run -t task_instance -t task_instance_history -t job -t log && exec airflow kubernetes cleanup-pods --namespace={{ .Release.Namespace }}"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

statsd:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# PgBouncer connection pooler - transaction mode returns connections to the pool
# after each transaction, preventing stale connection issues after DB restarts
pgbouncer:
  enabled: true
  metadataPoolSize: 25
  resultBackendPoolSize: 10
  maxClientConn: 200
  extraIni: |
    server_reset_query = DISCARD ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Web UI credentials - ALL fields required or the create-user hook job fails.
# The 'role' field is particularly important - omitting it causes an empty role error.
webserver:
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    firstName: Admin
    lastName: User
    email: admin@example.com
    password: PLACEHOLDER_AIRFLOW_ADMIN_PASSWORD
