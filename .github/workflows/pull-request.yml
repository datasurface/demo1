name: Pull Request Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  datasurface-pr-validator:
    name: DataSurface PR Validator
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PR code
      uses: actions/checkout@v7
      with:
        # Must specify repository for fork-based PRs when using pull_request_target
        # Without this, checkout looks for the SHA in the base repo where it doesn't exist
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr
        persist-credentials: false

    - name: Checkout main branch code
      uses: actions/checkout@v7
      with:
        # Pin to the PR's base commit, not the moving 'main' ref.
        ref: ${{ github.event.pull_request.base.sha }}
        path: main
        persist-credentials: false

    - name: Login to GitLab Container Registry
      uses: docker/login-action@v4
      with:
        registry: registry.gitlab.com
        username: ${{ secrets.GITLAB_USERNAME }}
        password: ${{ secrets.GITLAB_ACCESS_TOKEN }}

    - name: Check for breaking change approval
      id: check_label
      # The label alone does not allow a breaking change: someone other than the PR author must
      # also have approved the PR's current head commit. Reviews are read live from the API, so
      # after an approval, re-run this job (or remove and re-add the label) to clear the check.
      env:
        HAS_BREAKING_CHANGE_APPROVAL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set -euo pipefail
        if [[ "$HAS_BREAKING_CHANGE_APPROVAL" != "true" ]]; then
          echo "ALLOW_BREAKS=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Read the head SHA live: a re-run reuses the original event payload, which may be stale.
        HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
        # Each reviewer's latest decisive review (APPROVED, CHANGES_REQUESTED or DISMISSED) must be
        # an approval of the current head commit. Comment-only reviews do not change a decision.
        NON_AUTHOR_APPROVALS=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" --jq '.[]' \
          | jq -s --arg author "$PR_AUTHOR" --arg head "$HEAD_SHA" '
              map(select(.user.login != $author
                         and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")))
              | group_by(.user.login)
              | map(max_by(.submitted_at))
              | map(select(.state == "APPROVED" and .commit_id == $head))
              | length')
        if [[ "$NON_AUTHOR_APPROVALS" -lt 1 ]]; then
          echo "::error::breaking-change-approved requires an approval of the current commit from someone other than the PR author ($PR_AUTHOR). Approve the PR, then re-run this check."
          exit 1
        fi
        echo "ALLOW_BREAKS=--allow-breaking-changes" >> "$GITHUB_OUTPUT"

    - name: Run check script in Docker container
      # PR-controlled values (branch name, repository) go through env, never inline in the script,
      # so they cannot inject shell commands into a job that holds registry credentials.
      env:
        WORKSPACE: ${{ github.workspace }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        ALLOW_BREAKS: ${{ steps.check_label.outputs.ALLOW_BREAKS }}
      run: |
        extra_args=()
        if [[ -n "$ALLOW_BREAKS" ]]; then
          extra_args+=("$ALLOW_BREAKS")
        fi
        docker run --rm \
          -v "$WORKSPACE/main:/workspace/main" \
          -v "$WORKSPACE/pr:/workspace/pr" \
          -e HEAD_REPOSITORY="$HEAD_REPOSITORY" \
          -e HEAD_BRANCH="$HEAD_BRANCH" \
          registry.gitlab.com/datasurface-inc/datasurface/datasurface:v1.52.5 \
          python -P -m datasurface.entrypoints.action /workspace/main /workspace/pr "${extra_args[@]}"
